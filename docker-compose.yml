# Local run: SQL Server + the API in Development mode (dev sign-in via X-Dev-User / X-Dev-Roles headers).
#   docker compose up --build    then open http://localhost:5080/openapi/v1.json
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Local_dev_Passw0rd!"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    depends_on:
      sql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Appointments: "Server=sql,1433;Database=appointments;User Id=sa;Password=Local_dev_Passw0rd!;TrustServerCertificate=True"
    ports:
      - "5080:8080"
