name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Appointments.slnx
      - name: Build
        run: dotnet build Appointments.slnx -c Release --no-restore
      # Integration tests start SQL Server with Testcontainers, using the runner's Docker.
      - name: Test
        run: dotnet test Appointments.slnx -c Release --no-build --logger trx --collect:"XPlat Code Coverage"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: appointments-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  bicep:
    name: Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint and compile
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
